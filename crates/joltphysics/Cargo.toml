[package]
name = "joltphysics"
description = "Safe Rust API for Jolt Physics"
version = "0.4.0+jolt-5.6.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pockerhead/jolt-rust-voidrun"
edition = "2021"

[features]
double-precision = ["joltphysics-sys/double-precision"]
cross-platform-deterministic = ["joltphysics-sys/cross-platform-deterministic"]
# Debug wireframe of colliders as line data (`PhysicsWorld::debug_lines`); also compiles Jolt's
# debug renderer into the native libraries.
debug-renderer = ["joltphysics-sys/debug-renderer"]
# Compiles Jolt with its debug assertions (`joltphysics-sys/asserts`); a failed assertion prints its
# message and aborts the process.
asserts = ["joltphysics-sys/asserts"]
# Generates the raw bindings with libclang at build time (`joltphysics-sys/bindgen`).
bindgen = ["joltphysics-sys/bindgen"]

[dependencies]
joltphysics-sys = { version = "0.4.0", path = "../joltphysics-sys" }

[dev-dependencies]
rayon = "1.11"

[[bench]]
name = "budgets"
harness = false
test = false
