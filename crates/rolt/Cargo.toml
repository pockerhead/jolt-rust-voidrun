[package]
name = "rolt"
description = "Safe Rust API for Jolt Physics"
version = "0.4.0+jolt-5.6.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pockerhead/jolt-rust-voidrun"
edition = "2021"

[features]
double-precision = ["joltc-sys/double-precision"]
cross-platform-deterministic = ["joltc-sys/cross-platform-deterministic"]

[dependencies]
joltc-sys = { version = "0.4.0", path = "../joltc-sys" }
