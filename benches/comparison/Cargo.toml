[package]
name = "comparison"
description = "Benchmarks oxijolt against Rapier and Avian on scenes ported from Rapier's stress tests"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false
default-run = "comparison"

[lib]
path = "src/lib.rs"

[[bin]]
name = "comparison"
path = "src/main.rs"

[features]
default = ["jolt"]
# Each engine is its own feature, so a published run builds one engine per binary.
jolt = ["dep:oxijolt"]
rapier = ["dep:rapier3d"]
avian = ["dep:avian3d", "dep:bevy"]
# The engines' multithreaded builds; without it Rapier and Avian run on the stepping thread alone.
parallel = ["rapier3d?/parallel", "avian3d?/parallel", "dep:rayon"]
# Rapier's 8-lane solver, a tuned variant (`rapier-simd8`).
simd8 = ["rapier3d?/simd8"]

[dependencies]
oxijolt = { path = "../../crates/oxijolt", optional = true }
rapier3d = { version = "=0.36.0", optional = true }
rayon = { version = "1", optional = true }
# Avian's own benchmark features plus its joint solver (`xpbd_joints`) and its step timer
# (`bevy_diagnostic`, read by the split runs); Bevy only with Avian.
avian3d = { version = "=0.7.0", optional = true, default-features = false, features = [
    "3d",
    "f32",
    "parry-f32",
    "simd",
    "xpbd_joints",
    "bevy_diagnostic",
] }
bevy = { version = "0.19", optional = true, default-features = false }
