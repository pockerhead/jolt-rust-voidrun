[package]
name = "xtask"
description = "Repository maintenance tasks: `cargo xtask bindings` regenerates the committed raw bindings"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# Pinned: the committed bindings are this version's output.
bindgen = "=0.73.2"
anyhow = "1"
# The archive list writer shares build/prebuilt*.rs with the oxijolt-sys build script.
sha2 = "0.10"
flate2 = "1.1"
tar = { version = "0.4.46", default-features = false }
cc = "1.4"
