name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Windows MSVC (${{ matrix.features || 'default' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "cross-platform-deterministic", "double-precision", "debug-renderer"]
        # The debug renderer is a feature of the safe crate (it forwards to joltphysics-sys);
        # enabling only the sys feature would leave the debug module and its tests unbuilt.
        include:
          - features: debug-renderer
            feature_args: --features joltphysics/debug-renderer
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      FEATURE_ARGS: ${{ matrix.feature_args || (matrix.features && format('--features joltphysics-sys/{0}', matrix.features)) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features || 'default' }}

      # The native cache key and the build.rs manifest both rely on these
      # constants matching the submodule gitlinks.
      - name: Check pinned commits
        id: pins
        run: |
          joltc=$(git rev-parse HEAD:crates/joltphysics-sys/vendor/joltc)
          jolt=$(git rev-parse HEAD:crates/joltphysics-sys/vendor/JoltPhysics)
          grep -q "\"$joltc\"" crates/joltphysics-sys/build.rs || { echo "build.rs JOLTC_COMMIT differs from the gitlink $joltc"; exit 1; }
          grep -q "\"$jolt\"" crates/joltphysics-sys/build.rs || { echo "build.rs JOLT_COMMIT differs from the gitlink $jolt"; exit 1; }
          echo "joltc=$joltc" >> "$GITHUB_OUTPUT"
          echo "jolt=$jolt" >> "$GITHUB_OUTPUT"

      - name: Restore native library
        id: native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/joltc-prefix
          key: joltc-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.joltc }}-${{ steps.pins.outputs.jolt }}-${{ matrix.features || 'default' }}-${{ hashFiles('crates/joltphysics-sys/native/**', 'crates/joltphysics-sys/build.rs') }}

      - name: Build native library
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          cargo build --workspace $FEATURE_ARGS
          shopt -s nullglob
          dirs=(target/debug/build/joltphysics-sys-*/out/joltc)
          [ ${#dirs[@]} -eq 1 ] || { echo "expected exactly one native prefix, found ${#dirs[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/joltc-prefix"
          cp -r "${dirs[0]}/lib" "${dirs[0]}/include" "${dirs[0]}/joltphysics-sys-manifest.txt" "$RUNNER_TEMP/joltc-prefix/"

      # Every later step links the cached prefix, so each run also exercises
      # the JOLTC_LIB_DIR validation. A manifest mismatch means the cache key
      # is wrong; fix the key rather than falling back to CMake.
      - name: Use the native library
        run: echo "JOLTC_LIB_DIR=$RUNNER_TEMP/joltc-prefix" >> "$GITHUB_ENV"

      # Without the feature, neither Jolt nor joltc may contain the debug renderer.
      - name: Debug renderer compiled only with its feature
        run: |
          present=no
          if grep -q -a JPH_DebugRenderer_Create "$JOLTC_LIB_DIR"/lib/joltc*.lib && grep -q -a DrawGeometry@DebugRendererSimple "$JOLTC_LIB_DIR"/lib/Jolt.lib; then present=yes; fi
          expected=no; [ "${{ matrix.features }}" = debug-renderer ] && expected=yes
          [ "$present" = "$expected" ] || { echo "debug renderer present=$present expected=$expected"; exit 1; }

      - run: cargo build --workspace --all-targets $FEATURE_ARGS
      - run: cargo test --workspace $FEATURE_ARGS
      - run: cargo clippy --workspace --all-targets $FEATURE_ARGS -- -D warnings
      - run: cargo doc --workspace --no-deps $FEATURE_ARGS

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
