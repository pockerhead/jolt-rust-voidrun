# Publishes oxijolt-sys and then oxijolt to crates.io. Started by hand from the Actions tab;
# needs a crates.io API token in the repository secret CARGO_REGISTRY_TOKEN.
name: Publish to crates.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      # Packages both crates, builds each from its package (Jolt included), then uploads them
      # in dependency order.
      - name: Publish
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
